apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-quality-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wine-quality-api
  template:
    metadata:
      labels:
        app: wine-quality-api
    spec:
      containers:
        - name: api
          image: wine-quality-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wine-quality-service
spec:
  selector:
    app: wine-quality-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
